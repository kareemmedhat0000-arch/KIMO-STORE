<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIMO STORE - المتجر الإلكتروني الاحترافي</title>
  <style>
    :root {
      --primary-color: #1e3c72;
      --secondary-color: #2a5298;
      --accent-color: #ff6b6b;
      --success-color: #27ae60;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 60px;
    }

    /* Navbar & Header */
    header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 25px 20px;
      box-shadow: 0 10px 25px rgba(30, 60, 114, 0.15);
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-actions button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }

    .user-actions button:hover {
      transform: translateY(-2px);
      background-color: #ee5253;
    }

    .search-box {
      max-width: 550px;
      margin: 15px auto 0;
    }

    .search-box input {
      width: 100%;
      padding: 14px 22px;
      font-size: 16px;
      border: 2px solid transparent;
      border-radius: 30px;
      outline: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: 0.3s ease;
    }

    .search-box input:focus {
      border-color: #64b5f6;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* Category Bar */
    .categories-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .cat-btn {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      color: #475569;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--secondary-color);
      color: white;
      border-color: var(--secondary-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(42, 82, 152, 0.2);
    }

    /* Admin Panel Style */
    #adminPanel {
      background: #ffffff;
      border: 2px solid var(--secondary-color);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 35px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      display: none;
    }

    #adminPanel h2 {
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    .stats-box {
      background: #e0f2fe;
      color: #0369a1;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
    }

    .admin-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .admin-form input, .admin-form select {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }

    .admin-form button {
      background-color: var(--success-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .admin-form button:hover {
      background-color: #219653;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.1);
    }

    .category-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(30, 60, 114, 0.85);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-info {
      padding: 18px;
      text-align: center;
    }

    .product-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .price-tag {
      margin-bottom: 15px;
    }

    .old-price {
      text-decoration: line-through;
      color: #94a3b8;
      font-size: 14px;
      margin-left: 8px;
    }

    .new-price {
      color: #e63946;
      font-weight: 800;
      font-size: 20px;
    }

    .clicks-counter {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 10px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 6px;
    }

    .buy-btn {
      display: block;
      width: 100%;
      background-color: var(--success-color);
      color: white;
      text-decoration: none;
      padding: 12px 0;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background-color: #219653;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      font-weight: 600;
    }
  </style>

  <!-- Firebase App & Auth & Firestore SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, increment, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAw_OcA9V1d-U2U5NOxi2b1Zr6p4btWllo",
      authDomain: "kimo-store-25525.firebaseapp.com",
      projectId: "kimo-store-25525",
      storageBucket: "kimo-store-25525.firebasestorage.app",
      messagingSenderId: "249337806839",
      appId: "1:249337806839:web:56fa64c8ce117ca98c78f2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const ADMIN_EMAIL = "kareemmedhat0000@gmail.com"; 

    let currentUser = null;
    let selectedCategory = "الكل";

    // تسجيل زائر للمتجر
    async function trackVisitor() {
      const visitorRef = doc(db, "analytics", "visitors");
      try {
        await updateDoc(visitorRef, { totalVisitors: increment(1) });
      } catch (e) {
        await setDoc(visitorRef, { totalVisitors: 1 });
      }
    }
    trackVisitor();

    // تسجيل الدخول والخروج
    document.getElementById("loginBtn").addEventListener("click", () => {
      if (!currentUser) {
        signInWithPopup(auth, provider).catch((error) => console.error(error));
      } else {
        signOut(auth);
      }
    });

    // متابعة حالة المستخدم
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const loginBtn = document.getElementById("loginBtn");
      const adminPanel = document.getElementById("adminPanel");

      if (user) {
        loginBtn.textContent = `خروج (${user.displayName.split(' ')[0]})`;
        
        if (user.email === ADMIN_EMAIL) {
          adminPanel.style.display = "block";
          loadAnalytics();
        } else {
          adminPanel.style.display = "none";
        }
      } else {
        loginBtn.textContent = "تسجيل دخول بجوجل";
        adminPanel.style.display = "none";
      }
      loadProducts();
    });

    // تحميل عدد زوار الموقع للـ CEO
    async function loadAnalytics() {
      const visitorRef = doc(db, "analytics", "visitors");
      const snap = await getDoc(visitorRef);
      if (snap.exists()) {
        document.getElementById("totalVisitorsCount").textContent = snap.data().totalVisitors || 0;
      }
    }

    // إضافة منتج جديد
    document.getElementById("addProductBtn").addEventListener("click", async () => {
      const title = document.getElementById("prodTitle").value;
      const oldPrice = document.getElementById("prodOldPrice").value;
      const newPrice = document.getElementById("prodNewPrice").value;
      const category = document.getElementById("prodCategory").value;
      const imgUrl = document.getElementById("prodImg").value;
      const link = document.getElementById("prodLink").value;

      if (!title || !newPrice || !link) {
        alert("يرجى ملء البيانات الأساسية للمنتج!");
        return;
      }

      try {
        await addDoc(collection(db, "products"), {
          title, oldPrice, newPrice, category, imgUrl, link,
          clicks: 0,
          createdAt: new Date()
        });
        alert("تمت إضافة المنتج بنجاح!");
        document.getElementById("prodTitle").value = "";
        document.getElementById("prodOldPrice").value = "";
        document.getElementById("prodNewPrice").value = "";
        document.getElementById("prodImg").value = "";
        document.getElementById("prodLink").value = "";
        loadProducts();
      } catch (e) {
        console.error("خطأ أثناء الإضافة: ", e);
      }
    });

    // تحميل المنتجات
    async function loadProducts() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "products"));
      
      querySnapshot.forEach((docSnap) => {
        const item = docSnap.data();
        
        // فلترة الأقسام
        if (selectedCategory !== "الكل" && item.category !== selectedCategory) {
          return;
        }

        const card = document.createElement("div");
        card.className = "product-card";
        card.setAttribute("data-title", item.title.toLowerCase());

        let deleteBtnHtml = "";
        let clicksHtml = "";

        if (currentUser && currentUser.email === ADMIN_EMAIL) {
          deleteBtnHtml = `<button class="delete-btn" onclick="deleteProduct('${docSnap.id}')">حذف المنتج</button>`;
          clicksHtml = `<div class="clicks-counter">👁️ عدد المهتمين (الضغطات): ${item.clicks || 0}</div>`;
        }

        card.innerHTML = `
          <span class="category-badge">${item.category || 'عام'}</span>
          <img src="${item.imgUrl || 'https://via.placeholder.com/250x180?text=منتج'}" alt="${item.title}">
          <div class="product-info">
            <div class="product-title">${item.title}</div>
            <div class="price-tag">
              ${item.oldPrice ? `<span class="old-price">${item.oldPrice} ج.م</span>` : ''}
              <span class="new-price">${item.newPrice} ج.م</span>
            </div>
            ${clicksHtml}
            <a href="${item.link}" target="_blank" class="buy-btn" onclick="trackClick('${docSnap.id}')">اطلب الآن</a>
            ${deleteBtnHtml}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // زيادة عداد الضغطات عند النقر على منتج
    window.trackClick = async (productId) => {
      const prodRef = doc(db, "products", productId);
      await updateDoc(prodRef, { clicks: increment(1) });
    };

    // فلترة الأقسام
    window.filterCategory = (category, btn) => {
      selectedCategory = category;
      const btns = document.querySelectorAll(".cat-btn");
      btns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadProducts();
    };

    // حذف منتج
    window.deleteProduct = async (id) => {
      if (confirm("هل أنت تأكد من حذف هذا المنتج؟")) {
        await deleteDoc(doc(db, "products", id));
        loadProducts();
      }
    };

    // البحث
    window.filterProducts = () => {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.getElementsByClassName("product-card");
      for (let card of cards) {
        const title = card.getAttribute("data-title");
        card.style.display = title.includes(input) ? "flex" : "none";
      }
    };
  </script>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="logo">KIMO STORE 🛒</div>
      <div class="user-actions">
        <button id="loginBtn">تسجيل دخول بجوجل</button>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="ابحث عن أحدث المنتجات والخصومات...">
    </div>
  </header>

  <div class="container">

    <!-- لوحة تحكم الـ CEO -->
    <div id="adminPanel">
      <h2>👑 لوحة تحكم الـ CEO</h2>
      <div class="stats-box">
        <span>📊 إجمالي زوار المتجر: <span id="totalVisitorsCount">0</span> زائر</span>
      </div>
      <div class="admin-form">
        <input type="text" id="prodTitle" placeholder="اسم المنتج">
        <select id="prodCategory">
          <option value="ملابس">ملابس</option>
          <option value="أجهزة إلكترونية">أجهزة إلكترونية</option>
          <option value="مستحضرات تجميل">مستحضرات تجميل</option>
          <option value="أثاث ومفروشات">أثاث ومفروشات</option>
          <option value="أدوات منزلية">أدوات منزلية</option>
        </select>
        <input type="text" id="prodOldPrice" placeholder="السعر القديم (اختياري)">
        <input type="text" id="prodNewPrice" placeholder="السعر الجديد">
        <input type="text" id="prodImg" placeholder="رابط صورة المنتج">
        <input type="text" id="prodLink" placeholder="رابط صفحة هبوط تاجر">
        <button id="addProductBtn">إضافة للمتجر 🚀</button>
      </div>
    </div>

    <!-- أزرار تصفية الأقسام -->
    <div class="categories-bar">
      <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
      <button class="cat-btn" onclick="filterCategory('ملابس', this)">الملابس</button>
      <button class="cat-btn" onclick="filterCategory('أجهزة إلكترونية', this)">أجهزة إلكترونية</button>
      <button class="cat-btn" onclick="filterCategory('مستحضرات تجميل', this)">مستحضرات تجميل</button>
      <button class="cat-btn" onclick="filterCategory('أثاث ومفروشات', this)">أثاث ومفروشات</button>
      <button class="cat-btn" onclick="filterCategory('أدوات منزلية', this)">أدوات منزلية</button>
    </div>

    <!-- شبكة عرض المنتجات -->
    <h2 style="color: #1e3c72; margin-bottom: 15px;">المنتجات المتاحة</h2>
    <div class="products-grid" id="productsGrid">
      <!-- المنتجات بتنزل هنا تلقائياً -->
    </div>

  </div>

</body>
</html>
